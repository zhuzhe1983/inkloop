[env:m5stack-papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
  lib/InkloopVoice/assets/speech/ordinal_first.wav
  lib/InkloopVoice/assets/speech/ordinal_second.wav
  lib/InkloopVoice/assets/speech/ordinal_third.wav
  lib/InkloopVoice/assets/speech/ordinal_number.wav
  lib/InkloopVoice/assets/speech/display_please_wait.wav
  lib/InkloopVoice/assets/speech/display_refresh_start.wav
  lib/InkloopVoice/assets/speech/device_restored.wav
  lib/InkloopVoice/assets/speech/ordinal_prefix.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_zero.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_one.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_two.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_three.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_four.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_five.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_six.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_seven.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_eight.wav
  lib/InkloopVoice/assets/speech/ordinal_digit_nine.wav
  lib/InkloopVoice/assets/speech/ordinal_ten.wav
  lib/InkloopVoice/assets/speech/ordinal_suffix.wav
  lib/InkloopVoice/assets/speech/confirmation_repeat_exactly.wav
  lib/InkloopVoice/assets/speech/confirmation_press_top_button.wav
  lib/InkloopVoice/assets/speech/confirmation_cancelled.wav
  lib/InkloopVoice/assets/speech/confirmation_expired.wav
  lib/InkloopVoice/assets/speech/storage_free_space.wav
  lib/InkloopVoice/assets/speech/storage_formatted.wav
  lib/InkloopVoice/assets/speech/images_empty.wav
  lib/InkloopVoice/assets/speech/images_list_ready.wav
  lib/InkloopVoice/assets/speech/images_deleted.wav
  lib/InkloopVoice/assets/speech/images_cleared.wav
  lib/InkloopVoice/assets/speech/settings_saved.wav
  lib/InkloopVoice/assets/speech/settings_reset.wav
  lib/InkloopVoice/assets/speech/voice_error.wav
  lib/InkloopVoice/assets/speech/voice_listening.wav
monitor_speed = 115200
extra_scripts =
  pre:lib/InkloopVoice/scripts/platformio_prompt_check.py
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  ; TLS certificate verification plus the AIGC client call chain exceeds the
  ; Arduino core's 8 KiB default loop stack on ESP32-S3. Keep network work on
  ; the single owner task, but give that task a measured safety margin.
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; Fresh PaperColor test flashes enter the new integration. Existing 0.2 NVS
  ; records retain their explicit false flag for a painless upgrade/rollback.
  -DINKLOOP_MYAI_FEATURE_DEFAULT=1
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified @ 0.2.20
  m5stack/M5GFX @ 0.2.27
  m5stack/M5PM1 @ 1.0.7
  adafruit/Adafruit NeoPixel @ 1.15.4
  bblanchon/ArduinoJson @ ^7.4.2
  tzapu/WiFiManager @ ^2.0.17
  links2004/WebSockets @ 2.6.1
