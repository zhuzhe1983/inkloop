services:
  inkloop:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkloop:local
    container_name: inkloop
    restart: unless-stopped
    init: true
    ports:
      - "${INKLOOP_PORT:-38080}:3000"
    volumes:
      - ./data:/data
      - ./config/.dev.vars:/app/.dev.vars:ro
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    stop_grace_period: 20s
